syntax = "proto3";

package crow.v1;

option go_package = "github.com/crow/crow/apps/daemon/gen/crow/v1;crowv1";

service CrowRuntimeService {
  rpc GetSnapshot(GetSnapshotRequest) returns (RuntimeSnapshot);
  rpc WatchRuntime(WatchRuntimeRequest) returns (stream RuntimeEvent);
}

service TaskService {
  rpc CreateTask(CreateTaskRequest) returns (Task);
  rpc GetTask(GetTaskRequest) returns (TaskDetail);
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);
  rpc WatchTask(WatchTaskRequest) returns (stream TaskEvent);
  // Stops a running task. The executor is cancelled and the task ends as "cancelled".
  rpc CancelTask(CancelTaskRequest) returns (Task);
}

service VoiceService {
  rpc StartVoiceSession(StartVoiceSessionRequest) returns (VoiceSession);
  rpc StreamAudio(stream AudioChunk) returns (stream VoiceEvent);
  rpc CancelVoiceSession(CancelVoiceSessionRequest) returns (CancelVoiceSessionResponse);
}

// Computer use: the app watches for commands, runs them on this Mac and
// submits results. The daemon never touches the screen or input itself.
service ComputerService {
  rpc WatchCommands(WatchComputerCommandsRequest) returns (stream ComputerCommand);
  rpc SubmitResult(ComputerResult) returns (SubmitComputerResultResponse);
  // Runs one action for an external agent (crowctl mcp) under Crow's rules.
  rpc Perform(PerformComputerActionRequest) returns (PerformComputerActionResponse);
}

// Reminders are created by the agent's reminder tools; the app shows them when due.
service ReminderService {
  rpc ListReminders(ListRemindersRequest) returns (ListRemindersResponse);
  rpc CancelReminder(ReminderRequest) returns (Reminder);
  // The app showed a fired reminder; it leaves the snapshot.
  rpc AckReminder(ReminderRequest) returns (Reminder);
}

service ApprovalService {
  rpc ListPendingApprovals(ListPendingApprovalsRequest) returns (ListPendingApprovalsResponse);
  rpc DecideApproval(DecideApprovalRequest) returns (Approval);
  // Active time-limited grants from the "once" policy.
  rpc ListGrants(ListGrantsRequest) returns (ListGrantsResponse);
  // Revokes grants for one scope, or all when scope is empty.
  rpc RevokeGrants(RevokeGrantsRequest) returns (ListGrantsResponse);
}

service SettingsService {
  rpc GetSettings(GetSettingsRequest) returns (Settings);
  rpc SaveSettings(SaveSettingsRequest) returns (Settings);
}

message GetSnapshotRequest {}

message WatchRuntimeRequest {}

message RuntimeSnapshot {
  RuntimeState state = 1;
  repeated Task recent_tasks = 2;
  repeated Approval pending_approvals = 3;
  // Reminders that came due and the app has not acknowledged yet.
  repeated Reminder due_reminders = 4;
}

message Reminder {
  string id = 1;
  string text = 2;
  string due_at = 3;
  // pending, fired or cancelled
  string status = 4;
  string created_at = 5;
  string fired_at = 6;
}

message ListRemindersRequest {}

message ListRemindersResponse {
  repeated Reminder reminders = 1;
}

message ReminderRequest {
  string id = 1;
}

message RuntimeEvent {
  string id = 1;
  string type = 2;
  RuntimeState state = 3;
  Task task = 4;
  TaskEvent task_event = 5;
  Approval approval = 6;
  string created_at = 7;
}

message RuntimeState {
  string status = 1;
  string phase = 2;
  string title = 3;
  string message = 4;
  string active_task_id = 5;
  int32 pending_approvals = 6;
  bool voice_listening = 7;
  bool voice_speaking = 8;
}

message CreateTaskRequest {
  string command = 1;
  string mode = 2;
}

message GetTaskRequest {
  string task_id = 1;
}

message WatchComputerCommandsRequest {}

message ComputerCommand {
  string id = 1;
  // screenshot, click, move, drag, type, key, scroll, open_app, release
  string action = 2;
  // Action arguments as a JSON object. Coordinates are in screenshot pixels.
  string args_json = 3;
}

message ComputerResult {
  string id = 1;
  bool ok = 2;
  string error = 3;
  // A screenshot taken after the action, if any.
  bytes image = 4;
  string image_media_type = 5;
  int32 width = 6;
  int32 height = 7;
  string text = 8;
}

message SubmitComputerResultResponse {}

message PerformComputerActionRequest {
  // Task that groups an external session's actions and approvals; empty starts a new one.
  string task_id = 1;
  // The computer tool's arguments, e.g. {"action":"click","element":3}.
  string args_json = 2;
  // Shown as the task title when a new task starts, e.g. the client's name.
  string client = 3;
}

message PerformComputerActionResponse {
  string task_id = 1;
  string text = 2;
  bytes image = 3;
  string image_media_type = 4;
}

message CancelTaskRequest {
  string task_id = 1;
}

message ListTasksRequest {
  int32 limit = 1;
  string status = 2;
}

message ListTasksResponse {
  repeated Task tasks = 1;
}

message WatchTaskRequest {
  string task_id = 1;
}

message Task {
  string id = 1;
  string title = 2;
  string kind = 3;
  string status = 4;
  string subtitle = 5;
  string created_at = 6;
  string updated_at = 7;
}

message TaskDetail {
  Task task = 1;
  repeated TaskEvent events = 2;
  Approval pending_approval = 3;
}

message TaskEvent {
  string id = 1;
  string task_id = 2;
  string type = 3;
  string title = 4;
  string message = 5;
  string created_at = 6;
}

message StartVoiceSessionRequest {
  string source = 1;
  string language = 2;
}

message VoiceSession {
  string id = 1;
  string status = 2;
  string created_at = 3;
}

message AudioChunk {
  string session_id = 1;
  bytes pcm = 2;
  int32 sample_rate = 3;
  int32 channels = 4;
  bool final = 5;
}

message VoiceEvent {
  string id = 1;
  string session_id = 2;
  string type = 3;
  string text = 4;
  bool final = 5;
  string created_at = 6;
}

message CancelVoiceSessionRequest {
  string session_id = 1;
}

message CancelVoiceSessionResponse {
  bool cancelled = 1;
}

message ListPendingApprovalsRequest {}

message ListPendingApprovalsResponse {
  repeated Approval approvals = 1;
}

message Grant {
  int64 id = 1;
  string scope = 2;
  string created_at = 3;
  string expires_at = 4;
}

message ListGrantsRequest {}

message ListGrantsResponse {
  repeated Grant grants = 1;
}

message RevokeGrantsRequest {
  string scope = 1;
}

message DecideApprovalRequest {
  string approval_id = 1;
  bool approved = 2;
  string reason = 3;
}

message Approval {
  string id = 1;
  string task_id = 2;
  string title = 3;
  string description = 4;
  int32 risk_level = 5;
  string proposed_action = 6;
  string preview = 7;
  string status = 8;
  string created_at = 9;
  string decided_at = 10;
}

message GetSettingsRequest {}

message SaveSettingsRequest {
  Settings settings = 1;
}

message Settings {
  reserved 1 to 6;
  reserved "codex_path", "codex_cwd", "codex_model", "codex_reuse_context", "codex_approval_policy", "codex_sandbox";
  string stt_language = 7;
  string tts_provider = 8;
  string tts_voice = 9;
  bool tts_streaming = 10;
  string island_screen = 11;
  string island_hotkey = 12;
  string island_idle_close_seconds = 13;
  // "local" (daemon calls the provider directly) or "cloud" (Crow Cloud).
  string agent_mode = 14;
  string llm_provider = 15;
  string llm_base_url = 16;
  string llm_model = 17;
  // Write-only. Never returned; see llm_api_key_set.
  string llm_api_key = 18;
  bool llm_api_key_set = 19;
  // Long-term memory (profile in prompt + memory tools). Defaults to on.
  bool memory_enabled = 20;
  // Approval policy per scope: every_turn, before_acting, once or never.
  string approval_computer = 21;
  string approval_terminal = 22;
  string approval_codex = 23;
  string approval_file_write = 24;
  // Computer use may only take screenshots.
  bool computer_see_only = 25;
  // Computer use is off until the user turns it on.
  bool computer_use_enabled = 26;
}
